[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fr3-cbf-completion"
version = "1.1.0"
description = "Completion and validation tools for dynamic FR3 incumbent-protection safety filters"
readme = "README_FIRST.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
full = ["cvxpy>=1.5,<2", "sgp4>=2.23,<3", "skyfield>=1.49,<2", "rasterio>=1.3,<2"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
