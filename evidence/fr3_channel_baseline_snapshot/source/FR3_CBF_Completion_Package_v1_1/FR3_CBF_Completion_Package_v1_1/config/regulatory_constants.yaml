metadata:
  file_version: "3.0.0"
  generated_utc: "2026-07-23T00:00:00Z"
  purpose: >-
    Single source of truth for standards-derived values, model decisions, and open
    verification items in the FR3 CBF project. PROVISIONAL and MODEL_DECISION values
    must not be presented as mandatory regulatory requirements.
  allowed_status_values:
    - CONFIRMED
    - PROVISIONAL
    - MODEL_DECISION
    - OPEN
    - NOT_USED
  no_guesswork_policy:
    - "A number without a source, edition, scope, and status is not a regulatory constant."
    - "Model decisions are separated from regulatory requirements."
    - "The +19 dB fixed-service short-term cap remains provisional until the real S1 gate passes."
    - "The in-force source and competent administration control if this file conflicts with them."
  disclaimer: >-
    Engineering-research configuration only; not legal or regulatory advice.

