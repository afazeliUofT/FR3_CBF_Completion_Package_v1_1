fixed_service_7725_8275_mhz:
  allocation_mhz: [7725.0, 8275.0]
  status: CONFIRMED
  canadian_channel_bandwidths_mhz: [30.0, 20.0, 10.0, 5.0, 2.5, 1.25]
  source: "ISED SRSP-307.7 Issue 6"
  long_term_aggregate:
    metric: "I_over_N_dB"
    limit_db: -10.0
    time_percentage_exceeded: 20.0
    status: CONFIRMED
    source: "ITU-R F.758-8"
    scope_note: >-
      Use as an engineering aggregate sharing criterion with its stated scope. Do not
      call it a universal Canadian licensing rule.
  short_term_candidate:
    metric: "I_over_N_dB"
    candidate_limit_db: 19.0
    candidate_set_db: [10.0, 13.0, 16.0, 19.0, 23.0]
    status: PROVISIONAL
    enforcement_first_implementation: "always_on_engineering_cap"
    freeze_gate: >-
      Real P.530-19 adequacy run on reviewed paired links, documented fade margins,
      explicit incremental worst-month outage allocations, official grids, and a
      predeclared sensitivity analysis.
    claim_boundary: >-
      A project engineering candidate derived through documented methodology; not a
      native mandatory 7-8 GHz criterion asserted from F.758-8.

