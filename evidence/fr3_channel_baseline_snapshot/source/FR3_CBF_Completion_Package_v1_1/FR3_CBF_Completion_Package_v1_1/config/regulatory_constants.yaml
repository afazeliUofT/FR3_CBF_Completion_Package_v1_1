  status: CONFIRMED
  source: "ISED SRSP-307.7 Issue 6"
  use_note: "An incumbent FS transmitter reference, not a cellular-sector power assumption."

eess_earth_station_8025_8400_mhz:
  allocation_mhz: [8025.0, 8400.0]
  metric: "aggregate_interfering_signal_power_at_earth_station_antenna_output"
  reference_bandwidth_mhz: 10.0
  minimum_elevation_deg: 5.0
  status: CONFIRMED
  criteria:
    - name: long_term
      threshold_dbw_per_10mhz: -150.0
      time_percentage_exceeded: 20.0
    - name: short_term
      threshold_dbw_per_10mhz: -133.0
      time_percentage_exceeded: 0.005
  source: "ITU-R SA.1027-6, 8025-8400 MHz terrestrial-path entries"
  modelling_decision:
    status: MODEL_DECISION
    text: >-
      The first paper conservatively treats the aggregate IMT network as one
      terrestrial interfering entry. Describe this as a study decision, not as quoted
      mandatory aggregation wording.

