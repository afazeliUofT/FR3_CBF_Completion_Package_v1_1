    exclusion_structure: "long-term integral lower bound t = 1e-6 (fraction)
       = the short-term tail governed by recommends 1.1 -> 'average power
       EXCLUDING short-term events'; standards precedent for the framework's
       S1-supplies-the-exclusion / S2-tracks-the-average split (Sec. 17)"
    consistency_note: "DltEPO <= 10 % <=> time-mean I/N <= 0.089 (-10.5 dB):
       numerically consonant with the F.758-8 long-term -10 dB level but a
       MEAN statement, NOT the 20 %-time percentile -> keep S2 (mean) and
       S3 (percentile) as distinct states, as the framework already does"
  derivation_template_for_7725_8275:  # the S1 derivation-appendix recipe
    step_1: "net fade margin F = FM - ATPC_range - (I/N)_st (Annex 1 sec. 2;
             example values there: ATPC_range 13 dB, I/N 20 dB)"
    step_2: "A% = p(fade depth > F) from Rec. P.530 multipath model, per
             representative GTA hop (length / terrain / geoclimatic factor)"
    step_3: "DstEPO = A% x p_st / EPO   (percentage of the EPO allowance)"
    step_4: "adequacy target: DstEPO << 10 %, nominally <= 1 % (10/90
             short/long apportionment); F.1494 worst case 2.7 % (37 dB FM
             international link, q_t = 4.2, SES objective), dropping to
             1.2 % at ATPC range 12 dB; all other tabled cases << 1 %"
    step_5: "if I/N statistics reach the short-term level: long-term
             allowance = 10 % - DstEPO (Annex 1 sec. 3; worked example
             10 - 2.7 = 7.3 %). NOTE: sec. 3 text cites 'Table 2' for the
             2.7 % value, which actually sits in Table 1 (SES) -- internal
             typo in the Recommendation, recorded so nobody trips on it"
    step_6: "choose ((I/N)_st, p_st) for 7725-8275 MHz s.t. the step-4
             target holds with 7-8 GHz P.530 statistics + F.758-8 Table 9
             typicals; because p_st ~ seconds/month, adopt as an ALWAYS-ON
             hard cap (S1) per the F.1494 hard-limit reading -- no
             short-term micro-budget"
    atpc_supplement: "A_w = FM - A_Range - A_Threshold (Annex 1 sec. 4);
             FDP = FDP0 + dFDP with
             dFDP = sum_{k>k_c} (10^{0.1 A_w} - 1) f_k (1 + (i/n)_k),
             k_c = largest index with 10 log(1 + (i/n)_k) < A_w
             (self-consistency check passed: A_w ~ 15 dB, f = 1e-5,
             i/n ~ 15 dB reproduces the stated dFDP ~ 1 %);
             supplementary long-term point criterion 'I/N >= 15 dB for
             <= 0.001 % of time' limits the ATPC sharing burden to ~1 %;
             alternative integral: DltEPO ~= (1/0.89) [ int_{1e-6}^{t_f}
             10^{0.1 A_w} dt + int_{t_f}^{1} (I(t)/N) dt ] x 100 %,
             t_f = fraction of time I(t)/N (dB) exceeds A_w
             -> candidate extra guard iff GTA links use ATPC (F.758-8
             sec. 4.14: nominal reduction 10 dB)"
    caution_terrestrial: "F.1494 is derived for NON-GSO SATELLITE
             interferers (interference uncorrelated with hop fading). For
             terrestrial IMT the F.758-8 sec. 5 correlated-fading rule
             applies (assume wanted Tx at MAX ATPC power) -> adapt the
             net-margin step accordingly; document in the appendix"
    open_input_FM: "fade-margin anchor for GTA links (Bucket-B item B8):
             RESOLVED DIRECTION at v0.8 -- SF.1650-1 states the criteria
             rest on a 24 dB net fade margin @ BER 1e-3, which sits inside
             the F.758-8 sec. 4.14 bracket (nominal Rx 10-15 dB above the
             1e-6 threshold + ATPC 10 dB -> 20-25 dB). Adopt 24 dB as the
             anchor, SWEEP 20-25 dB; ATPC placement relative to the anchor
             is a sweep axis; per-link TAFL budgets remain the refinement"
  spawned_lookups: ["Rec. ITU-R P.530 -- COMPLETED at v0.8 (P.530-19, see
             p530_multipath)", "optional: F.1565 / F.1668 (EPO values;
             F.1494 recognizing d)-e)) or derive EPO from G.826 as already
             recorded under A2 time_basis"]

