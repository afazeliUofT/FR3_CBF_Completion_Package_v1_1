p452_interference:                    # A8 core (COMPLETED 2026-07-03)
  status: CONFIRMED
  source: "Recommendation ITU-R P.452-18, Prediction procedure for the
           evaluation of interference between stations on the surface of
           the Earth at frequencies above about 100 MHz (Question 208/3)"
  edition: "P.452-18 (08/2023), approved 2023-10-21; In force (Main),
            confirmed on itu.int landing page; WP 3M-approved reference
            software tracks -18 (no -19 exists)"
  archived_as: "constants/sources/R-REC-P.452-18-202310.pdf (project copy
            RRECP_45218202310.pdf, 55 pp; same bytes as hashed)"
  accessed: "2026-07-03"
  scope: "100 MHz to 50 GHz; clear-air AND hydrometeor-scatter mechanisms;
       consistent prediction of basic transmission loss over time
       percentages p from 0.001 % to 50 % of an average year (verbatim
       range statement located and recorded)"
  worstmonth_native: "Step 2: models predict ANNUAL distributions; for
       worst-month, convert pw -> annual-equivalent p via eq (1):
       p = 10^[(log10 pw + log10 GL - 0.186 omega - 0.444)/(0.816 +
       0.078 omega)], GL per eq (1a) (1.1 +/- |cos 2phi|^0.7 for |phi|
       <=/> 45 deg), omega = over-water fraction; clamp 12 p >= pw.
       ROLE SPLIT: P.452 paths use THIS conversion; P.841-7 is the
       general converter for other statistics"
  radiometeorology: "three inputs: DeltaN (lapse rate, lowest 1 km ->
       effective Earth radius), beta0 (anomalous-propagation incidence,
       eq (2), path-centre latitude), N0 (sea-level surface refractivity,
       troposcatter only); path-centre values from the integral maps"
  clutter_mechanism:                  # THE harmony refinement
    finding: "P.452-18 contains ZERO references to P.2108 (full-text
       verified). Clutter enters via the PATH PROFILE: Step 4 builds
       g_i = terrain h_i + representative clutter height per ground-cover
       category (eq (6e)); endpoints and all points within 50 m of either
       terminal remain BARE TERRAIN; warnings recorded: bare-terrain
       profiles UNDER-estimate diffraction loss in clutter; surface-height
       (clutter-included) data may OVER-estimate"
    table3_defaults: "exactly FOUR rows (verified at raster + full-text
       'Dense' grep = prose-only hits): Water/sea 0 m; Open/rural 0 m;
       Suburban 10 m; Urban/trees/forest 15 m. NO dense-urban default --
       prose states high-rise categories (~30 m physical) may warrant
       SMALLER-than-physical representative heights; local clutter-height
       statistics preferred where available"
    harmony_consequence: "coordination-grade default for GTA rooftop FS
       victims = P.452-18 with clutter-in-profile (GTA land-cover raster
       -> categories -> Table-3/ local heights). P.2108 sec. 3.2 is an
       ALTERNATIVE end-correction only where a terminal is genuinely in
       clutter and the path model is clutter-free -- never additive to a
       clutter-bearing profile. Report v3: rewrite the harmony-table
       BS->FS model cell + Sec. 9.2 defect-4 wording accordingly"
  hydrometeor: "sec. 5 full bistatic hydrometeor-scatter method present
       (single scatter; works with F.699 / F.1245 / S.465 / S.580
       patterns); optional for Case T (clear-air dominates short GTA
       co-channel paths) -- usage, if any, documented"
  integral_products: "R-REC-P.452-18-202310-I!!ZIP-E.zip: DN50.txt,
       N050.txt (+ LAT.txt / LON.txt companions); 1.5-deg global grid,
       lon 0..360, lat +90..-90; ten-year (1983-1992) radiosonde basis;
       bilinear interpolation per P.1144. RECEIVED + VERIFIED at v1.5 --
       see p452_18_integral_data (zip + per-file hashes in registry)"
  inputs_note: "Table 1 basic inputs incl. Gt/Gr toward the horizon along
       the great-circle path, dct/dcr coast distances; Table 4 derived
       path-profile parameters (omega = db/d etc.)"

p2108_clutter:                        # A8 (COMPLETED 2026-07-03)
  status: CONFIRMED
  source: "Recommendation ITU-R P.2108-1, Prediction of clutter loss"
  edition: "P.2108-1 (09/2021); In force (Main): -0 (06/2017) superseded,
            SG3 reference software (WPs 3K/3M) tracks -1; DRAFT -2 WATCH:
            CEPT tooling discussion (Nov 2025) of a draft revising sec.
            3.3 (slant path) to 0.5-100 GHz with new inputs (ground-
            station antenna height, median clutter height); sec. 3.2 not
            indicated as changing; VERIFY approval status at freeze"
  archived_as: "constants/sources/R-REC-P.2108-1-202109.pdf (project copy
            RRECP_21081202109.pdf, 10 pp; same bytes as hashed)"
  accessed: "2026-07-03"
  sec31_heightgain: "0.03-3 GHz height-gain terminal correction (J(nu),
       eqs (1)-(2g); Table 3 R defaults incl. Dense urban 20 m) -- OUT OF
       BAND for 7.7-8.3 GHz; recorded for completeness"
  sec32_terrestrial:                  # verified at raster
    scope: "urban/suburban; terminal heights WELL BELOW the clutter
       (source measurements up to 6 m above ground) -> mostly
       INAPPLICABLE to 20-60 m rooftop FS victims and to the 25 m UMa BS;
       operative only for below-rooftop legs (UMi sensitivity)"
    validity: "0.5-67 GHz; minimum path 0.25 km (correction at ONE end) /
       1.0 km (both ends); 0 < p < 100 % locations"
    equations: "Lctt = -5 log(10^-0.2Ll + 10^-0.2Ls) - sigma_cb
       Q^-1(p/100) (3a); sigma_cb = sqrt[(sigma_l^2 10^-0.2Ll +
       sigma_s^2 10^-0.2Ls)/(10^-0.2Ll + 10^-0.2Ls)] (3b);
       Ll = -2 log(10^(-5 log f - 12.5) + 10^-16.5), sigma_l = 4 dB
       (4a-b); Ls = 32.98 + 23.9 log d + 3 log f, sigma_s = 6 dB (5a-b);
       cap: Lctt <= Lctt(d = 2 km) (6)"
    apply_once_anchor: "sec. 3.2 states the correction must NOT be
       applied when the transmission-loss model (e.g. P.1411) inherently
       accounts for clutter over the path -- P.452-18 WITH clutter-in-
       profile is such a model: never combine the two"
  sec33_earthspace:
    validity: "10-100 GHz; elevation 0-90 deg; eq (7) with K1 = 93 f^0.175,
       A1 = 0.05, -0.6 Q^-1(p/100) term"
    gap_at_8ghz: "the 10 GHz floor means NO valid statistical clutter
       model exists for the 8 GHz Case-S-prime Earth-space path in the
       in-force edition -> conservative default: NO clutter credit at the
       IMT end; revisit if/when P.2108-2 (extending to 0.5 GHz) is
       approved"

