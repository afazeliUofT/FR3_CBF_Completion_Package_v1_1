p841_worstmonth:                      # A8 addition (COMPLETED 2026-07-03)
  status: CONFIRMED
  source: "Recommendation ITU-R P.841-7, Conversion of annual statistics
           to worst-month statistics (Question ITU-R 201/3)"
  edition: "P.841-7 (08/2022); In force (Main): -6 (08/2019) superseded;
            no -8 exists"
  archived_as: "constants/sources/R-REC-P.841-7-202208.pdf (project copy
            RRECP_8417202208.pdf, 9 pp; same bytes as hashed)"
  accessed: "2026-07-03"
  equations:                          # verified at raster
    core: "pw = Q p (eq 1), 1 <= Q <= 12; q = 100 - p, qw = 100 - pw
       conversions (eqs 2-3, added at -7)"
    q_piecewise: "eq (4): Q = 12 for p < (Q1/12)^(1/beta) %;
       Q = Q1 p^-beta for (Q1/12)^(1/beta) <= p < 3 %;
       Q = Q1 3^-beta for 3 % <= p < 30 %;
       Q = Q1 3^-beta (p/30)^(log(Q1 3^-beta)/log 0.3) for p >= 30 %"
    inverse: "p = pw/Q (eq 5); Q = Q1^(1/(1-beta)) pw^(-beta/(1-beta))
       (eq 6), valid 12 p0 <= pw <= Q1 3^(1-beta), p0 = (Q1/12)^(1/beta)"
    global: "Q1 = 2.85, beta = 0.13 -> p(%) = 0.30 pw(%)^1.15 (eq 7),
       valid 1.9e-4 <= pw(%) <= 7.8"
    rain_regional: "Q1 = 2.82 / beta = 0.15 (tropical, subtropical,
       temperate frequent-rain); Q1 = 4.48 / beta = 0.11 (dry temperate,
       polar, desert)"
  applicability_notes:
    - "framework percentages vs eq (7) window: 20 % (long-term) and
       0.005 % (Case S short-term) and 4.5e-4 % (S1 ES) are INSIDE;
       1.2e-5 % (SES) is BELOW the window -> Q saturates at 12 and
       p = pw/12 applies -- exactly the SES-percentage regime"
    - "ROLE SPLIT recorded: P.452 paths use P.452-18's own eq (1)
       worst-month conversion; P.841-7 is the general converter for
       other statistics (F.1494-template handling, clocks 3-4
       documentation)"

