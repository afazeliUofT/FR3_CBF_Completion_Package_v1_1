f1108_fdp:                            # spawned by A2 (COMPLETED 2026-07-02)
  status: CONFIRMED
  source: "Recommendation ITU-R F.1108-4, Determination of the criteria to
           protect fixed service receivers from the emissions of space
           stations operating in non-geostationary orbits in shared
           frequency bands"
  edition: "F.1108-4 (01/2005); revision train 1994-1995-1997-2002-2005;
            status In force (Main), SG5, confirmed on itu.int rec page"
  archived_as: "constants/sources/R-REC-F_1108.pdf"
  accessed: "2026-07-02"
  fdp_definition:
    discrete: "FDP = sum_i f_i (I_i / N_T)            (Annex 3, eq. (15))"
    continuous: "FDP = I_av / N_T with I_av = int_0^inf I p_I(I) dI
                 (Annex 3, eqs. (23)-(24)); the two forms declared equivalent"
    fml: "FML = 10 log10(1 + FDP)                     (Annex 3, eq. (16));
          mean interference above noise (dB) = 10 log10(FDP)"
    reading: "first moment of the interference-power distribution over
              thermal noise = fractional increase in outage probability"
  validity_and_caveats:
    - "recommends NOTE 1: FDP applies where MULTIPATH fading is the principal
       fading cause (rain-dominated paths: further study) -- 7725-8275 MHz
       qualifies; consistent with F.758-8 Annex 1 sec. 4 usage"
    - "recommends NOTE 1 + Annex 3 sec. 4: short-term / high-level
       interference assessment is OUTSIDE FDP scope (further study) -> FDP
       must be paired with a separately constructed short-term criterion,
       exactly the framework's S1/S2 split"
    - "Annex 3 sec. 4: eqs. (15)-(16) may UNDERESTIMATE degradation for
       interference ~20 dB above N_T (dispersive term, non-Rayleigh shallow
       fading) -> the S1 exclusion also keeps the S2/FDP tracker inside the
       FDP validity regime"
  diversity_extension:                # NEW FINDING -> v3 framework item
    switched: "DFDP = 2 I_av/N_T + I2/N_T^2      (Annex 4, eqs. (29)-(32))"
    max_power_combining: "DFDP = 2 I_av/N_T + (3/2) I2/N_T^2
                          (Annex 4, eqs. (33)-(36))"
    second_moment: "I2 = int_0^inf I^2 p_I(I) dI     (Annex 4, eq. (31))"
    dfml: "DFML = 5 log10(1 + DFDP) (eq. (37)); variance form eq. (39):
           DFML = 5 log10(1 + 2 FDP + FDP^2 (1 + var_I/I_av^2))"
    variance_warning: "Annex 4 sec. 5: when interference variance >> mean^2
       (found for satellite constellations; equally characteristic of
       beam-sweeping IMT) the SECOND-MOMENT term is the dominant effect"
    framework_note: "S2 (EMA) tracks the FIRST moment only; compliance never
       rests on S2 (unchanged). QUEUED v3 COROLLARY: S1 + S3 jointly yield
       deterministic per-prefix moment bounds
         I_av <= (1-p) I_lt + p I_st,  I2 <= (1-p) I_lt^2 + p I_st^2,
       hence certified FDP and diversity-DFDP bounds via eqs. (24)/(30)/(35)
       -- converts the 'first-moment-only' reviewer attack into a result and
       strengthens the -13 dB diversity-sweep rationale"
  worst_month: "Annex 5: FS performance objectives apply in ANY month
       (nominal 30-day); assess on worst month; repeat-period and
       longitudinal-uniformity guidance for constellation sims -- corroborates
       timing clock #3; HEO month-stability caveat noted (not applicable:
       Case S drives geometry from real TLEs)"
  other_machinery: "Annex 6: C/(N+I)-distribution method for intermediate
       fade depths / bilateral assessment; Annexes 1, 7 + App. 2: non-GSO
       visibility statistics and analytical geometry -- CONTEXT ONLY (Case S
       uses SGP4 ephemerides directly)"
