sa1023_methodology:                   # spawned by A4 (COMPLETED 2026-07-02)
  status: CONFIRMED
  source: "Recommendation ITU-R SA.1023, Methodology for determining sharing
           and coordination criteria for systems in the Earth exploration-
           satellite and meteorological-satellite services (Question 138/7)"
  edition: "SA.1023-0 (03/94), approved 1994-03-21; In force (Main),
            confirmed on itu.int rec page; official English PDF listed at
            15 988 bytes = byte size of the project copy"
  archived_as: "constants/sources/R-REC-SA.1023-0-199403.pdf (project copy
            RRECSA_10230199403.pdf, 3 pp; same bytes as hashed)"
  accessed: "2026-07-02"
  initial_division:                   # Annex 1, verified at raster
    longterm_power_basis: "is(20) = i(20) x As/100 (eq. 1a);
       it(20) = i(20) - is(20) (eq. 1b) -- WATTS; divided on a POWER basis
       because long-term space and terrestrial interference are present
       simultaneously"
    shortterm_time_basis: "is(ps) = i(p) - it(20) (eq. 2a);
       it(pt) = i(p) - is(20) (eq. 2b) -- WATTS; ps = p x as/100 (eq. 2c);
       pt = p - ps (eq. 2d). Short-term enhancements assumed NOT simultaneous
       across categories, but the OTHER category's long-term power is
       subtracted from the short-term total"
    framework_note: "eq. (2) coupling is why Case-S thresholds must be the
       SA.1027-6 TERRESTRIAL-path column, never the SA.1026-5 aggregate:
       the terrestrial budget already presumes space paths at long-term
       level"
  single_entry:                       # verified at 300 dpi, p.3
    longterm: "i'(20) = i(20) / n (eq. 3) -- power divided by equivalent
       number of interferers n"
    shortterm: "i'(p') = i(p)/(y n) - i(20) x (1 - y) (eq. 4a);
       p' = p / n (eq. 4b); y = fraction of interferers simultaneously
       enhanced (0 < y < 1), analogous to a correlation coefficient, usually
       1/n (mutually uncorrelated entries). With y = 1/n: one entry enhanced
       takes i(p) minus the (n-1) others' long-term power; exceedance TIME
       is split p/n per entry"
    framework_notes:
      - "n = 1 collapse: single-entry = path-apportioned aggregate exactly
         -> FORMAL basis for the A4 decision (whole IMT network treated as
         one entry consuming the terrestrial allotment); previously recorded
         as a conservative reading, now a cited construction"
      - "eq. (4b) per-entry exceedance-TIME budgeting is the standards
         ancestor of the S3 budget arithmetic -- lineage sentence for
         Secs. 17/21 at v3"
      - "multi-operator refinement path recorded: n > 1 with y = 1/n gives
         closed-form per-entry criteria -> NEW Bucket-B item B9 (sweep
         n in {1,2,3}, y = 1/n; default n = 1)"

sa1026_sa1027_reconstruction:         # consistency check (OUR derivation)
  status: "RECONSTRUCTED -- verify wording against archived SA.1027-6"
  band: "8 025-8 400 MHz, per 10 MHz"
  inputs: "SA.1026-5 aggregate i(20) = -147 dBW, i(p) = -133 dBW @ 0.0125 %
       (verified today) vs SA.1027-6 terrestrial column -150 dBW @ 20 % and
       -133 dBW @ 0.005 % (recorded at A4, prior session), which also
       recorded equivalent_terrestrial_interferers ~ 2 (lt and st)"
  level_arithmetic: "-150 = -147 - 3.01 dB (a factor-2 power division --
       degenerate between the two readings below); short-term level:
       i(p) minus a -150 dBW long-term contribution = -133.087 dBW ->
       rounds to -133 (matches under both readings)"
  time_discriminator: "0.005 % = 0.0125 % x 0.40 EXACTLY (SA.1023 eq. 2c-d
       with as = 60, i.e. 60/40 space/terrestrial TIME split); a pure n = 2
       single-entry time split (eq. 4b) would instead give
       0.0125/2 = 0.00625 % -- does NOT match. The recorded 0.005 % therefore
       favours the INITIAL-DIVISION reading"
  most_consistent_joint_reading: "SA.1027-6 tabulated values = the
       TERRESTRIAL-PATH TOTALS from SA.1023 eqs (1)-(2) applied to the
       SA.1026-5 aggregate with As ~ 50 (power 50/50) and as = 60 (time
       60/40 space/terrestrial); the recorded n ~ 2 is the equivalent-
       interferer count available for FURTHER per-entry subdivision via
       eqs (3)-(4), not already applied in the table. Under this reading
       the A4 decision (whole IMT network under the tabulated threshold)
       consumes the ENTIRE terrestrial allotment -- maximally conservative"
  action: "one-liner vs archived SA.1027-6 text: confirm (a) tabulated
       values are path TOTALS not single-entry, (b) stated As/as (or
       equivalent wording), (c) how n ~ 2 is framed. The As = 50 / as = 60
       values are OUR reconstruction, not a quoted clause; do not cite them
       as SA.1027-6 statements until (a)-(c) are checked"

