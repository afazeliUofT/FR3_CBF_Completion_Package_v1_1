# A2 -- Rec. ITU-R F.758 (COMPLETED 2026-07-02)
# -----------------------------------------------------------------------------
f758_fs_protection:
  source: "Recommendation ITU-R F.758-8, System parameters and considerations
           in the development of criteria for sharing or compatibility between
           digital FWS in the FS and systems in other services"
  edition: "F.758-8 (02/2025)"          # CORRECTION: supersedes F.758-7 guess
  archived_as: "constants/sources/R-REC-F_758-8-202502-I__PDF-E.pdf"
  accessed: "2026-07-02"
  status: CONFIRMED

  long_term_criterion:
    definition: "Long-term interference characterized as the power exceeded by
                 20% of the time at the victim receiver input"
    clause_definition: "Annex 1, sec. 4"
    IN_db_aggregate: -10                # bands above 3 GHz, co-primary sharing
    clause_value: "Annex 2, sec. 4.13, Table 5"
    caveats:
      - "Table 5 labels -10 dB a STARTING POINT; where simultaneous
         interference from multiple co-primary services is non-negligible,
         -10 dB is the MAX AGGREGATE across ALL other co-primary services
         (apportionment per F.1094; Annex 1 sec. 2.2). Paper must state the
         share claimed by IMT."
      - "Annex 1 Table 2: for SPACE-DIVERSITY links, I/N = -10 dB corresponds
         to 20% EP degradation; holding the F.1094 10% budget on diversity
         hops implies I/N = -13 dB. TAFL does not flag diversity ->
         SWEEP I_lt over {-10, -13} dB."
    apportionment_f1094: {X_fs_pct: 89, Y_coprimary_pct: 10, Z_other_pct: 1,
                          clause: "Annex 1, sec. 2.1"}

  short_term_criterion:
    status: DECISION                    # numeric value NOT in F.758-8 for 7-8 GHz
    finding: "F.758-8 defines short-term qualitatively (highest levels
              occurring < 1% of time, sized to cause an error-performance
              defect with the wanted signal unfaded; Annex 1 secs. 4, 4.2) and
              defers numeric construction to band-specific recs (F.1494:
              10.7-12.75 GHz; F.1495: 17.7-19.3; F.1606: 37-42). NONE covers
              7-8 GHz."
    chosen_route: "Multipath-dominant band (< ~15 GHz, Annex 1 sec. 4):
              adopt the FDP method of Rec. ITU-R F.1108 -- average interference
              power (EXCLUDING periods above the short-term limit) as the
              long-term critical value -- and construct the short-term
              EP-defect threshold per the F.1494 methodology with Report
              ITU-R M.2119 Annex 5 examples. Both to be documented as a
              derivation appendix, not presented as a lookup."
    spawned_lookups: ["Rec. ITU-R F.1108 (in-force)", "Rec. ITU-R F.1494",
                      "Report ITU-R M.2119 Annex 5", "Rec. ITU-R F.1094"]
    framework_note: "FDP legitimizes safety state S2 (EMA average-power
              tracker) as standards-aligned for this band; S3 budget carries
              the 20%-of-time formulation; S1 carries the constructed
              short-term defect cap. Fold wording into framework v3."

  time_basis:                           # feeds timing convention clock #3
    error_performance: "per MONTH (ITU-T G.826), fulfilled in the WORST MONTH
                        (Rec. ITU-R P.581; annual<->worst-month via P.841)"
    availability: "per YEAR (ITU-T G.827); only interference lasting > 10
                   consecutive seconds affects availability"
    clause: "Annex 1, sec. 1.1.2.1"
    fast_varying_note: "Sec. 1.1.2.2: relatively fast-varying interference ->
                   error-performance study on worst-month basis predominates.
                   IMT beam/traffic dynamics fall in this category."

  receiver_typicals_7725_8500:          # Annex 2, Table 9, cols '7.725-8.500'
    reference_arrangement: "Rec. ITU-R F.386"
    noise_figure_db: {simple_16qam: [2.5, 6], complex_128qam: [2.5, 8]}
    feeder_multiplexer_loss_db: [0, 3.0]
    antenna_gain_dbi: [12, 48.6]
    rx_noise_density_dbw_mhz: [-141.5, -136]     # = -144 + NF (sec. 4.11)
    eirp_range_dbw: [5.5, 55]           # cross-checks SRSP-307.7 cl.7 cap = 55
    tx_power_range_dbw: [-6.5, 13]
    long_term_limit_density: "N_RX(dBW/MHz) + I/N  (sec. 4.13)"
    convention_note: "Criterion naturally expressed as DENSITY (dBW/MHz) --
                   cleaner for tone-group partial-overlap (epsilon) handling."
    channel_spacings_listed_mhz: [1.25, 2.5, 5, 7, 10, 11.662, 14, 20, 28, 29.65, 30, 40]
    domestic_note: "Generic F.758 list includes 40 MHz+; SRSP-307.7 caps
                   Canada at 30 MHz -- DOMESTIC PLAN GOVERNS Case-T population."

  atpc_and_levels:                      # for short-term construction later
    nominal_rx_above_ber1e6_db: [10, 15]          # sec. 4.14
    atpc_nominal_reduction_db: 10                 # sec. 4.14
    terrestrial_interferer_rule: "correlated fading -> assume wanted Tx at MAX
                   ATPC power (sec. 5)"
    ber_level_offsets: "1e-6 vs 1e-3: 1-2 dB (FEC), ~4 dB uncoded (sec. 3.1)"

  deployment_statistics:                # optional Monte-Carlo realism
    urban_suburban_rural_example_pct: [60, 30, 10]   # Annex 2, sec. 2.2
    eirp_actual_vs_theoretical_max_db: [1.5, 2.7]    # Attachment 1
    eirp_mu_plus_2sigma_below_theoretical_db: ~3

