       15 K, dT 0.095 mK, dP -269 dB(W/Hz), dPH -202 dBW, SH.df -156
       dB(W/m2), SH -233 dB(W/(m2.Hz)) -- on the 10%%-of-dP basis
       (dPH = 0.1 dP df), 2000 s integration, 0 dBi sidelobe reference,
       pfd conversion +20 log f - 158.5; RA.769 itself ADOPTS the
       SA.509 side-lobe model as the RAS reference antenna
       (corroborates the Group-2 record). RA.1513-2 recommends: 5 %%
       aggregate / 2 %% per network; recommends 3 option (3) defines
       data loss as the PERCENTAGE OF 2000-s INTEGRATION PERIODS whose
       average spectral pfd exceeds RA.769 (0 dBi) -- natively the
       exceedance-fraction shape of the S3 budget (slots = integration
       periods, p = 2 %%); recommends 4 -> Annex 1 sec. 3.3.2 for
       unwanted emissions (the Case-R scenario class; read if Case R
       confirmed kept). TR 38.803 RE-PULL COMPLETE: V14.4.0 docx
       (38803-e40; history ...14.3.0 2024-06 RAN#104 RP-241381 ->
