m2101_methodology:                    # Group 3 (COMPLETED 2026-07-04)
  status: CONFIRMED
  source: "Recommendation ITU-R M.2101-0, Modelling and simulation of IMT
           networks and systems for use in sharing and compatibility
           studies"
  edition: "M.2101-0 (02/2017), approved 2017-02-09; sole edition,
            In force (Main), confirmed on itu.int landing page"
  archived_as: "constants/sources/R-REC-M.2101-0-201702.pdf (project copy
            RRECM_21010201702IPDFE.pdf, 36 pp; same bytes as hashed);
            archival housekeeping duty CLOSED"
  accessed: "2026-07-04"
  element_pattern_form:               # Annex 1 Table 3; verified at raster
    equations: "A_E,H(phi) = -min[12 (phi/phi3dB)^2, Am] dB;
       A_E,V(theta) = -min[12 ((theta - 90)/theta3dB)^2, SLAv] dB;
       A_E(theta, phi) = GE,max - min{-[A_E,H + A_E,V], Am} dBi"
    parameters: "phi3dB, theta3dB, Am, SLAv, GE,max are ALL input
       parameters -- M.2101 fixes the FORM, not the values. The report's
       8 dBi / 65-65 deg / 30 dB figures are the TR 38.803 example
       parameterization; the A5-sourced 7-8 GHz values (6.4 dBi, 90/65,
       3-element subarrays) come from TR 38.922 Table 5.4.1.2-1"
  composite_pattern: "Annex 1 Table 4: A_A,Beam_i(theta, phi) =
       A_E(theta, phi) + 10 log10 |sum_{m=1..NH} sum_{n=1..NV}
       w_{i,n,m} v_{n,m}|^2; superposition vector v_{n,m} =
       exp(j 2 pi [(n-1) dV/lambda cos(theta) + (m-1) dH/lambda
       sin(theta) sin(phi)]); consistent with the framework's eq.-(9)
       convention (element gain once in beta-bar, array gain via the
       beamformers)"
  adjacent_band_rule:                 # sec. 5 intro -- Case-R relevance
    finding: "M.2101 states an AAS's unwanted (out-of-block) emission is
       NON-CORRELATED across elements and therefore has an antenna
       pattern similar to a SINGLE ELEMENT; the composite (beamformed)
       pattern applies only inside the channel bandwidth -- in both
       interferer and victim adjacent-band roles"
    consequence: "source-native eps_adj treatment for Case R (B6): the
       adjacent-band interferer gain toward the RAS victim uses the
       ELEMENT pattern (GE,max-class, no array gain), not the composite
       beam; TR 38.922 clause 7.3 (correlation roll-off / array-ACLR
       models) is the newer refinement layer if more fidelity is needed.
       B6 recompute inputs now fully sourced: ACLR 30 dB (TR 38.922
       Table 6.3.1.3-1) + element-pattern gain rule (M.2101 sec. 5)"
  monte_carlo_flow: "snapshot procedure: BS grid (wrap-around option);
       drop 2K-10K UEs; HO-margin cell selection; K chosen UEs per cell;
       equal-RB scheduling with P_BS_UE = P_BS_Max n/M (eq. 5); BSs
       transmit at full power or stay silent with load probability x %
       (single number or per-snapshot range) -- the network-loading
       mechanism; external interference accumulated per eq. (6):
       I_External = P_BS_UE - CL_External - ACIR_linear (FDR
       substitutable); deployment VALUES (densities, x %, TDD split)
       intentionally not fixed by M.2101 -> B10 sources them"
  roles: "aggregation methodology for Case S-prime (P.619 + M.2101 per
       the harmony table); element-pattern lineage anchor for eq. (9);
       loading/TDD conventions cited by B10"

