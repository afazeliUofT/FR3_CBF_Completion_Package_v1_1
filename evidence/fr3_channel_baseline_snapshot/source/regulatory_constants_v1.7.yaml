sa1027_eess:                          # A4 (COMPLETED 2026-07-02)
  status: CONFIRMED
  source: "Recommendation ITU-R SA.1027-6 (08/2019), Sharing criteria for
           space-to-Earth data transmission systems in the EESS and MetSat
           services using satellites in low-Earth orbit"
  archived_as: "constants/sources/R-REC-SA-1027-6-201908.pdf"
  accessed: "2026-07-02"
  band_8025_8400:                     # Table 1 row; TERRESTRIAL path applies
    long_term:                        #  to IMT BS interference (Note 4)
      threshold: "-150 dBW per 10 MHz  (= -120 dBm per 10 MHz)"
      time_percentage: 20
      space_to_earth_path_for_reference: "-167 dBW per 10 MHz"
    short_term:
      threshold: "-133 dBW per 10 MHz  (= -103 dBm per 10 MHz)"
      time_percentage: 0.0050         # percent of time
      space_to_earth_path_for_reference: "-133 dBW/10 MHz @ p=0.0025%"
    min_elevation_deg: 5              # footnote (1): >=25 deg applies only to
                                      # 137-138 MHz; all other bands >=5 deg
    notes:
      - "Note 1: SINGLE-ENTRY thresholds per reference bandwidth; narrower
         interferers -> total power within the 10 MHz window; wider/partial
         overlap -> apply frequency-dependent rejection. Implementation:
         evaluate IMT aggregate PSD over the WORST 10 MHz window in the ES
         passband (meshes with the tone-group epsilon machinery)."
      - "Note 3: BOTH long-term and short-term criteria must be met -> maps
         exactly onto S1 (short-term hard cap) + long-term budget state."
      - "Note 4: terrestrial-path column applies to terrestrial transmitting
         stations (incl. IMT BS) and transmitting earth stations."
      - "recommends 3: services with LOWER allocation status held to 1% of
         the criteria -- NOT applicable to IMT under a co-primary mobile/fixed
         allocation (Sec. 6: fixed and mobile are primary in 8025-8400)."
      - "Criteria are ABSOLUTE interfering powers: Case-S protection needs no
         ES noise-figure assumption (simplifies the framework instantiation)."
    apportionment_table2:             # derivation context (SA.1023 method)
      long_term_space_vs_terrestrial_pct: [1, 99]
      short_term_space_vs_terrestrial_pct: [20, 80]
      equivalent_terrestrial_interferers: {long_term: 2, short_term: 2}
    aggregate_treatment: DECISION
    decision: "Conservative default: enforce the SINGLE-ENTRY terrestrial
       threshold on the ENTIRE IMT network aggregate (the network then
       consumes one of ~2 equivalent-interferer slots -- errs safe).
       Refinement path: aggregate criteria from SA.1026 with the SA.1023
       apportionment methodology. SPAWNED LOOKUPS: SA.1026, SA.1023 --
       CLOSED at v0.7 (see sa1026_aggregate, sa1023_methodology,
       sa1026_sa1027_reconstruction). Decision unchanged and now formally
       grounded (SA.1023 eqs (3)-(4), n = 1 collapse); verify-wording
       one-liner pending against archived SA.1027-6."
  correction_log: "Earlier v0.2-era anchor (-116 dBW/10 MHz @ 0.005%, quoted
       via CEPT Rec (19)01 search snippet) is the 25.5-27 GHz Table 1 row;
       replaced by the authoritative 8025-8400 values above. Lesson recorded:
       secondary-source anchors are expectations, never values."
