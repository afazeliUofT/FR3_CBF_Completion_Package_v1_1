  deep_fading_method:                 # sec. 2.3.1; verified at 300 dpi
    scope: "single-frequency (narrow-band) fade-depth distribution, AVERAGE
       WORST MONTH, any location, no path profile; multipath set to zero
       for d <= 5 km"
    eq5: "|eps_p| = |hr - he| / d   (mrad; d in km)"
    eq6: "hc = (hr + he)/2 - d^2/102 - ht   (m; ht = mean terrain
       elevation along the path, excluding trees)"
    eq7: "pw = K d^3.51 (f^2 + 13)^0.447 x 10^[ -0.376 tanh((hc-147)/125)
       - 0.334 |eps_p|^0.39 - 0.00027 hL + 17.85 vsr - A/10 ]   %"
    eq8: "vsr = min{ (dN75/5075)^1.8 exp(-hc/(2.5 sqrt(d))), vsr_limit }"
    eq9: "vsr_limit = dN75 d^1.5 f^0.5 / 24730"
    eq10: "rough lower frequency limit fmin ~ 15/d GHz"
    error_stats: "NOTE 1: overall prediction-error sigma 5.2 dB (incl.
       year-to-year variability); mean error < 3 dB over the 21 source
       regions -> feeds the uncertainty-box appendix (B1-B3)"
    validity: "NOTE 2: regression on 539 links; d 7.5-300 km;
       f 0.45-37 GHz (expected valid to >= 45 GHz); |eps_p| <= 37 mrad;
       hL 17-2 300 m; hc 26-1 180 m; dN75 0-54 N-units; grazing LOS at
       ke = 1.33. CASE-T COVERAGE: 7.7-8.3 GHz and GTA hop geometry sit
       inside all ranges (per-link confirmation to run in the pipeline)"
  all_percentages_method:             # sec. 2.3.2; verified at 300 dpi
    eq11: "p0 = eq. (7) with A = 0 (multipath occurrence factor)"
    eq12: "At = 25 + 1.2 log10(p0)  dB (deep/shallow transition)"
    deep_branch: "A >= At: pw = p0 x 10^(-A/10)   (eq. 13)"
    shallow_branch: "A < At: pt = p0 x 10^(-At/10) (eq. 14; cap
       99.9999 %); q'a = -20 log10(-ln((100 - pt)/100)) / At (eq. 15);
       qt = (q'a - 2)/[(1 + 0.3 x 10^(-At/20)) 10^(-0.016 At)]
       - 4.3 (10^(-At/20) + At/800) (eq. 16);
       qa = 2 + [1 + 0.3 x 10^(-A/20)][10^(-0.016 A)]
       [qt + 4.3 (10^(-A/20) + A/800)] (eq. 17);
       pw = 100 (1 - exp(-10^(-qa A/20)))   % (eq. 18)"
    operative_branch_note: "candidate net margins F = FM - ATPC -
       (I/N)_st are small or negative once ATPC and the S1 level are
       netted (exact placement of ATPC relative to the 24 dB anchor is a
       B8 sweep axis) -> the SHALLOW branch (eqs. 14-18) is the operative
       one for step 2; F <= 0 handled as in F.1494 Table 2 (A% = fading
       probability at ~0 dB depth)"
    qt_lineage: "eq. (16)'s qt is the same parameter family as the qt
       values (4.2 / 2.2) attached to the F.1494 example links -- lineage
       closed"
  time_basis: "'worst month' = 'any month' per P.581, stated in the
       introduction -> timing clock #3 corroborated; sec. 2.3.4 gives
       worst-month -> annual conversion; sec. 2.3.5 shorter worst periods;
       sec. 6 diversity improvement factors available for the -13 dB
       diversity sweep if needed"
  step2_recipe: "per GTA link: d, he/hr from TAFL; ht from DEM; K and dN75
       by P.1144 bilinear interpolation of LogK.csv / dN75.csv at the path
       centre; F = FM - ATPC_range - (I/N)_st with FM anchored at 24 dB
