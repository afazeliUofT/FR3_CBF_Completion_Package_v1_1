  revision_note: "-19 REVISED the multipath machinery: K now comes from the
       LogK.csv map (or measured fading data per the Attachment), and a new
       subrefractive parameter dN75 (0.1 %-of-average-worst-month
       refractivity increase over the lowest 75 m, from dN75.csv) enters
