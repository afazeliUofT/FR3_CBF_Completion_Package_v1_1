schema_version: 1
purpose: >-
  Freeze a transparent reference antenna-pattern model and a deterministic
  19-site/57-sector UMa layout for the operator-independent E3 experiment.

inputs:
  station_staging_csv: data/real/e3_reference_case/earth_station_staging.csv
  station_source_record_json: data/real/e3_reference_case/E3_STATION_SOURCE_RECORD.json
  pass_selection_json: data/real/e3_reference_case/E3_PASS_SELECTION.json
  selected_pass_track_csv: data/real/e3_reference_case/e3_track_selected_pass_1s.csv
  sa509_pdf: data/external/itu/R-REC-SA.509-3-201312-I!!PDF-E.pdf
  sa509_source_record_json: data/external/itu/SA509_SOURCE_RECORD.json
  layout_dem_subset: data/external/mrdem_e3_layout/mrdem_dtm_study_subset.tif
  layout_dem_source_record: data/external/mrdem_e3_layout/MRDEM_SOURCE_RECORD.json

outputs:
  review_dir: data/real/e3_pattern_layout_review
  final_station_csv: data/real/earth_station.csv
  final_sites_csv: data/real/bs_sites.csv
  final_sectors_csv: data/real/bs_sectors.csv
  decision_json: data/real/E3_PATTERN_LAYOUT_DECISION.json
  decision_md: data/real/E3_PATTERN_LAYOUT_DECISION.md

antenna_pattern:
  recommendation: ITU-R SA.509-3
  recommendation_date: 2013-12
  official_url: https://www.itu.int/dms_pubrec/itu-r/rec/sa/R-REC-SA.509-3-201312-I%21%21PDF-E.pdf
  use_status: REFERENCE_MODEL_IN_ABSENCE_OF_MEASURED_PATTERN_NOT_EESS_MANDATE
  nominal_use: section_1_2_multiple_entry_aggregate_pattern
  conservative_sensitivity: section_1_1_single_entry_peak_envelope
  carrier_ghz: 8.15
  aperture_efficiency_nominal: 0.65
  aperture_efficiency_sensitivity: [0.55, 0.65, 0.75]
  efficiency_status: MODEL_SENSITIVITY_NOT_MEASURED
  require_d_over_lambda_at_least: 100.0

layout:
  deployment_label: MODELLED_3GPP_UMA_REFERENCE_NOT_OPERATOR_DEPLOYMENT
  site_count: 19
  sectors_per_site: 3
  inter_site_distance_m: 500.0
  cluster_center_offset_from_station_m: 3000.0
  cluster_center_bearing_deg: 180.0
  lattice_rotation_deg: 30.0
  minimum_baseline_site_to_station_m: 1500.0
  sector_azimuths_deg: [0.0, 120.0, 240.0]
  downtilt_deg_nominal: 10.0
  bs_height_m_agl: 25.0
  array_rows: 16
  array_cols: 16
  element_gain_dbi: 8.0
  conducted_power_dbm_per_100mhz: 46.0
  activity_factor_full_scale: 1.0
  mrdem_padding_deg: 0.02
  sensitivity_grid:
    cluster_center_offset_from_station_m: [2000.0, 3000.0, 5000.0]
    cluster_center_bearing_deg: [0.0, 90.0, 180.0, 270.0]
    lattice_rotation_deg: [0.0, 30.0]
    phase_center_height_m_agl: [13.0, 20.0, 30.0]

manual_confirmations:
  selected_pass_plot_reviewed: false
  station_coordinate_limitations_understood: false
  sa509_reference_use_not_mandate_understood: false
  efficiency_grid_is_model_sensitivity: false
  layout_is_modelled_not_operator_deployment: false
  pattern_plot_reviewed: false
  layout_plot_and_geojson_reviewed: false
  site_elevations_and_minimum_distance_reviewed: false
