schema_version: 1
name: FR3 distributed dynamic incumbent-safety experiment
claim_boundary: DYNAMIC_EXPERIMENT_CONTRACT_NOT_PAPER_RESULT

system:
  sectors: 57
  polarization_modes_per_sector: 2
  protected_receiver: EESS earth station
  protected_bandwidth_hz: 10000000
  short_threshold_dbw_per_10mhz: -133.0
  primary_channel_case: UMa at 8.15 GHz
  local_beamformer: local RZF
  safety_repair: exact local DLP projection
  central_instantaneous_ue_csi: prohibited
  central_complex_precoder_exchange: prohibited

action:
  variable: q_bm_db
  interpretation: power attenuation in dB of incumbent-parallel mode m at sector b
  amplitude_scale: s_bm = 10^(-q_bm_db/20)
  leakage_power_scale: 10^(-q_bm_db/10)
  minimum_db: 0.0
  maximum_db: 80.0
  command_slew_constraint: abs(q_cmd[k+1]-q_cmd[k]) <= rho_db_per_update
  applied_delay: q_app[k] = q_cmd[max(k-d,0)]
  fail_safe:
    - hold last certified command
    - use preloaded geometry-indexed safe command
    - local power backoff when local post-implementation verification fails

aggregate_interference:
  nominal_mode_contribution: c_bm[k] = kappa_b[k] * L_bm[k]
  protected_interference: I[k] = sum_bm c_bm[k] * 10^(-q_app_bm[k]/10)
  robust_form: use upper coupling c_upper_bm[k] in every safety constraint
  local_certificate:
    - every sector enforces I_b[k] <= beta_b[k]
    - beta_b[k] >= 0
    - sum_b beta_b[k] <= I_allow[k]
    - therefore sum_b I_b[k] <= I_allow[k]
  numerical_slack_reporting: mandatory
  hidden_emergency_slack: prohibited

information_partition:
  local_bs_knows:
    - local UE CSI
    - local RZF precoder
    - exact local incumbent direction
    - current applied attenuation
    - scalar local leakage budget
    - local utility-cost curve
  slow_coordinator_receives:
    - sector_id
    - scalar predicted or measured nominal incumbent leakage
    - piecewise-linear local utility-cost curve or breakpoints
    - current command and applied action
    - message age and health status
  slow_coordinator_never_receives:
    - UE channel vectors
    - UE covariance matrices
    - complex precoder matrices
    - user payload data

controllers:
  - id: unprotected_rzf
    role: cellular reference
  - id: uniform_power_backoff
    role: conservative scalar baseline
  - id: hard_spatial_null
    role: geometry-only beam baseline
  - id: common_scale_oracle_dlp
    role: exact one-seed pilot reference; not a practical controller
  - id: static_geometry_nonuniform
    role: offline nonuniform leakage allocation
  - id: myopic_utility_safety
    role: current-state practical baseline
  - id: virtual_queue
    role: long-term constraint baseline
  - id: predictive_cbf
    role: proposed rate-limited safety filter
  - id: centralized_future_oracle
    role: labelled upper benchmark only

fair_comparison:
  identical_for_non_oracle_methods:
    - channel and traffic realization
    - measurements
    - message delay
    - update period
    - action slew limit
    - uncertainty set
    - local beamformers
    - emergency fallback
  oracle_exception: centralized_future_oracle may use future truth but must retain the same action delay and slew limit

first_experiment_grid:
  update_interval_s: [1, 5, 10]
  message_delay_intervals: [0, 1, 2]
  attenuation_slew_db_per_update: [1, 3, 6]
  active_load_fraction: [0.25, 0.50, 0.75, 1.00]
  traffic_transition:
    - static
    - abrupt_activation
  nonpaper_uncertainty_smoke_coupling_db: [0, 1, 3]
  note: uncertainty values above are smoke-test stresses only; paper uncertainty sets require calibration

required_metrics:
  safety:
    - violation_count
    - maximum_threshold_excess_w
    - minimum_safety_margin_db
    - emergency_slack_count
    - emergency_slack_energy
  utility:
    - network_sum_spectral_efficiency
    - 5th_percentile_user_spectral_efficiency
    - user_outage_fraction
    - per_user_rate_retention_quantiles
    - protected_subband_rate
    - total_bandwidth_rate
  control:
    - command_total_variation
    - maximum_command_slew
    - active_sector_count
    - budget_message_count
    - bytes_per_update
  runtime:
    - local_projection_time
    - local_rzf_time
    - coordinator_time
    - end_to_end_update_time

decisive_rate_limit_gate:
  required_pattern:
    - myopic method waits near the safety boundary
    - identical slew and delay prevent adequate later retreat
    - myopic method violates or invokes declared emergency fallback
    - predictive_cbf acts earlier
    - predictive_cbf stays safe without hidden slack
    - predictive_cbf has lower utility loss than hard null or broad backoff
  acceptance: utility-advantage confidence interval must exclude zero in the final campaign

long_term_criterion:
  status: OPEN_EXACT_REGULATORY_FUNCTIONAL
  rule: do not substitute an arbitrary moving average for the sourced long-term criterion

paper_campaign_gate:
  minimum_channel_topology_seeds: 30
  minimum_protected_passes: 5
  global_layout_rotations: required
  finite_network_edge_sensitivity: required
  practical_array_or_hybrid_sensitivity: required
  uncertainty_calibration: required
  confidence_intervals: required
