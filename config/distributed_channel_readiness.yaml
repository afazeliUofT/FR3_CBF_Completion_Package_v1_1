schema_version: 1
purpose: >-
  Independently close the distributed leakage-projected RZF architecture
  prototype, repair its package manifest, freeze the exact next experiment
  contract, and collect a bounded text-only snapshot of the existing FR3
  channel/topology implementation for code-level reuse without adopting WMMSE
  as the operational method.

claim_boundary:
  architecture_review: PASS_ARCHITECTURE_MATH_ONLY_NOT_PAPER_RESULT
  channel_snapshot: SOURCE_REVIEW_ONLY_NOT_EXECUTION_EVIDENCE
  experiment_freeze: PAPER_EXPERIMENT_SPECIFICATION_NOT_RESULT

inputs:
  architecture_decision_json: data/real/distributed_ia_rzf_architecture/DISTRIBUTED_IA_RZF_ARCHITECTURE_DECISION.json
  prototype_audit_json: data/real/distributed_ia_rzf_architecture/DISTRIBUTED_IA_RZF_PROTOTYPE_AUDIT.json
  prototype_validation_json: data/real/distributed_ia_rzf_architecture/DISTRIBUTED_IA_RZF_VALIDATION.json
  prototype_time_summary_csv: data/real/distributed_ia_rzf_architecture/prototype_time_summary.csv
  architecture_manifest: DISTRIBUTED_IA_RZF_ARCHITECTURE_MANIFEST.sha256
  architecture_source: src/fr3_cbf/distributed_precoding.py
  prototype_source: scripts/27_1_run_distributed_ia_rzf_prototype.py
  bs_sites_csv: data/real/bs_sites.csv
  bs_sectors_csv: data/real/bs_sectors.csv
  earth_station_csv: data/real/earth_station.csv

outputs:
  work_dir: data/real/distributed_channel_readiness
  evidence_dir: evidence/distributed_channel_readiness
  source_snapshot_dir: evidence/fr3_channel_baseline_snapshot
  log_dir: logs/distributed_channel_readiness

expected:
  branch: e3-first-sector-p452
  required_ancestor_commit: 6d6a589ad0dc08c052f51eb669aeeb9a37c77b14
  sector_count: 57
  site_count: 19
  protected_sample_count: 587
  prototype_sector_time_rows: 33459
  minimum_rate_retention_fraction: 0.997729005553827

method_naming:
  previous_name: distributed_ia_rzf
  paper_name: DISTRIBUTED_LEAKAGE_PROJECTED_RZF
  acronym: DLP_RZF
  reason: >-
    The operational safety action is an exact rank-one Euclidean leakage
    projection applied after local RZF. This is more precise than implying that
    the incumbent constraint enters only through RZF regularization.

architecture_review:
  accepted:
    - local_rzf_power_normalization
    - exact_single_direction_euclidean_projection
    - local_leakage_budget_enforcement
    - aggregate_budget_sum_certificate
    - transmit_power_nonincrease
    - no_network_wide_ue_csi
    - no_joint_network_precoder
  not_tested_by_prototype:
    - 3gpp_bs_ue_channel_model
    - inter_cell_ue_interference
    - real_ue_geometry_and_mobility
    - rate_limited_budget_updates
    - control_message_delay
    - channel_estimation_error
    - array_calibration_error
    - hybrid_or_codebook_factorization
    - physical_layer_bler
    - multi_seed_statistics
    - runtime_and_messaging_overhead
  prototype_interpretation: >-
    The 99.77% rate-retention value is a deterministic local-channel,
    intra-cell-only software result. It is not evidence of paper-level cellular
    utility.

